<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spa Glow Kitty - Enterprise</title>
  
  <!-- POLÍTICA DE SEGURIDAD DE CONTENIDO (CSP) -->
  <!-- 1. default-src: Solo origen local -->
  <!-- 2. script-src: Scripts locales y SDKs de Google/Firebase -->
  <!-- 3. connect-src: APIs de Firebase y wss: para sincronización en tiempo real (WebSockets) -->
  <!-- 4. style-src: Requerido por Tailwind CSS y Framer Motion -->
  <!-- 5. img-src: Avatares de Google y procesamiento de imágenes -->
  <!-- 6. font-src: Fuentes locales únicamente -->
  <!-- 7. frame-src: Dominio de Auth (Crítico para el flujo de Login) -->
  <!-- 8. object-src: Bloqueo de plugins externos -->
  <!-- 9. base-uri: Protección contra secuestro de base URL -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://www.googletagmanager.com; connect-src 'self' wss: https://identitytoolkit.googleapis.com https://firestore.googleapis.com https://firebase.googleapis.com https://securetoken.googleapis.com https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com; font-src 'self'; frame-src 'self' https://kitty-spa-5bc3b.firebaseapp.com; object-src 'none'; base-uri 'self';">
  <style>
    body {
      background-color: #FFF0F5;
      background-image: radial-gradient(rgba(255, 182, 193, 0.4) 2px, transparent 2px);
      background-size: 30px 30px;
      color: #2D1B2E;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 182, 193, 0.8); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #FF2A7A; }
  </style>

  </head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
